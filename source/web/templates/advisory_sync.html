<section class="advisory-sync" aria-labelledby="sync-heading">
  <div class="section-header">
    <h2 id="sync-heading">신규 공지 수집</h2>
    <span class="sync-status" data-sync-status>대기</span>
  </div>
  <p class="muted" id="sync-help">게시일 기준(UTC, 시작일·종료일 포함)으로 최대 100건을 가져와, 중복을 제외하고 Notion에 저장합니다.</p>
  <form class="sync-form" data-sync-form aria-describedby="sync-help">
    <div class="sync-date">
      <label for="sync-start">시작일</label>
      <input id="sync-start" name="started_at" type="date" required
             value="{{ sync_state.current.period_start if sync_state.current else sync_default_start }}">
    </div>
    <div class="sync-date">
      <label for="sync-end">종료일</label>
      <input id="sync-end" name="ended_at" type="date" required
             value="{{ sync_state.current.period_end if sync_state.current else sync_default_end }}">
    </div>
    <button class="run-button" type="submit" data-sync-button disabled>신규 공지 가져오기</button>
  </form>
  <noscript><p class="muted">공지 수집에는 JavaScript가 필요합니다.</p></noscript>
  <p class="sync-error" data-sync-error role="alert" hidden></p>
  <div class="sync-feedback" role="status" aria-live="polite">
    <p data-sync-message>기간을 선택해 신규 공지를 가져오세요.</p>
    <p class="muted" data-sync-period></p>
    <p class="muted" data-sync-counts></p>
  </div>
  <a class="refresh-link" data-sync-results hidden href="{{ url_for('security_advisories', refresh=1) }}">저장된 공지 보기 →</a>
</section>
